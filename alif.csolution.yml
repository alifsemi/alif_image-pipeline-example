# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/tools/projmgr/2.6.0/tools/projmgr/schemas/csolution.schema.json
solution:
  created-for: cmsis-toolbox@2.12.0
  cdefault:

  # List of tested compilers that can be selected
  select-compiler:
    - compiler: GCC

  # Select used compiler
  compiler: GCC

  packs:
    - pack: ARM::CMSIS@6.0.0

  target-types:
    - type: DevKit-E8-HE
      device: Alif Semiconductor::AE822FA0E5597LS0:M55_HE
      board: Alif Semiconductor::DevKit-E8
      variables:
        - BoardLayer: $SolutionDir()$/board/devkit-e8/board.clayer.yml
      define:
        - "CORE_M55_HE"
      target-set:
        - set:

    - type: DevKit-E8-HP
      device: Alif Semiconductor::AE822FA0E5597LS0:M55_HP
      board: Alif Semiconductor::DevKit-E8
      variables:
        - BoardLayer: $SolutionDir()$/board/devkit-e8/board.clayer.yml
      define:
        - "CORE_M55_HP"
      target-set:
        - set:
          images:
            - project-context: image_pipeline_sd_fatfs.debug

    - type: AppKit-E8-HE
      device: Alif Semiconductor::AE822FA0E5597BS0:M55_HE
      board: Alif Semiconductor::AppKit-E8-AIML
      variables:
        - BoardLayer: $SolutionDir()$/board/appkit-e8/board.clayer.yml
      define:
        - "CORE_M55_HE"
      target-set:
        - set:

    - type: AppKit-E8-HP
      device: Alif Semiconductor::AE822FA0E5597BS0:M55_HP
      board: Alif Semiconductor::AppKit-E8-AIML
      variables:
        - BoardLayer: $SolutionDir()$/board/appkit-e8/board.clayer.yml
      define:
        - "CORE_M55_HP"
      target-set:
        - set:
          images:
            - project-context: image_pipeline_mram.debug

  build-types:
    - type: debug
      optimize: none
      debug: on
      define:
        - _DEBUG
    - type: release
      optimize: balanced
      debug: on

  define:
    - UNICODE
    - _UNICODE

  projects:
    - project: image_pipeline_mram/image_pipeline_mram.cproject.yml
    - project: image_pipeline_sd_fatfs/image_pipeline_sd_fatfs.cproject.yml
